<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetLab Pro</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0F1E;--card:#111A2E;--ink:#EAF0FF;--mut:#93A3C4;--pri:#235AAE;--pri2:#18243F;--ac:#3BB2F6;--hot:#F59E0B;--line:#2A3A5A;--inp:#0D1526;--bad:#EF4444;--ok:#10B981}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,#14264A 0,var(--bg) 380px) no-repeat;color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14px}
#app{max-width:560px;margin:0 auto;padding:0 14px 40px}
header{text-align:center;padding:26px 0 16px;border-bottom:1px solid var(--line);margin:0 -14px 16px}
h1{margin:0;font-size:30px;line-height:1.3}
header p{margin:4px 0 12px;color:var(--mut)}
.lg{display:inline-flex;gap:6px}
.lg button{padding:6px 16px;border-radius:20px;background:var(--pri2);border:1px solid var(--line);color:var(--mut);font-size:12px;cursor:pointer}
.lg button.on{background:var(--ac);color:#04121F;border-color:transparent}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:16px}
nav button{width:calc(33.33% - 7px);background:var(--pri2);border:1px solid var(--line);padding:14px 4px;font-weight:600;font-size:13px;color:var(--mut);border-radius:14px;cursor:pointer}
nav button.on{background:var(--ac);color:#04121F;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px}
.df{display:inline-block;padding:4px 8px;font-size:12px;border-radius:8px;background:var(--pri2);color:var(--ac);margin-bottom:10px}
h2{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bd{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:#12382F;color:var(--ok)}
.bd.b2{background:#12243F;color:var(--ac)}
.ds{color:var(--mut);margin:0 0 14px;font-size:14.5px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--inp);color:var(--ink);font-size:14px;font-family:inherit;box-sizing:border-box}
input[dir=ltr]{text-align:left}
.row{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
.row>*{min-width:0;flex:1}
.row .sm{flex:0 0 auto}
button{font:inherit;font-weight:600;border:1px solid var(--ac);border-radius:14px;padding:12px 16px;cursor:pointer;background:var(--inp);color:var(--ink)}
button.pri{background:var(--pri2);border-color:var(--line);color:var(--ac)}
button.g{background:var(--inp);border-color:var(--line);color:var(--mut)}
section{display:none}
section.on{display:block}
.stat{display:flex;gap:10px;margin-bottom:12px}
.stat div{flex:1;background:var(--inp);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px}
.stat b{display:block;color:var(--ac);font-size:15px;margin-top:4px}
.sn{background:var(--inp);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;font-family:monospace;direction:ltr;font-size:13.5px}
.err{color:var(--bad);font-weight:600}
.ok{color:var(--ok);font-weight:600}
.lane{position:relative;height:60px;direction:ltr;margin:0 8px 12px}
.lane::before{content:'';position:absolute;top:8px;width:100%;height:4px;background:var(--line);border-radius:4px}
.lane .c{left:0}.lane .r{right:0}
.lane hr{position:absolute;top:38px;left:0;width:100%;height:4px;background:var(--line);border:0}
.cl{position:absolute;top:24px;left:2px;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#04121F;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:11px}
.stp{display:flex;gap:8px;margin-bottom:12px}
.stp div{flex:1;text-align:center;padding:8px;border-radius:14px;background:var(--inp);border:1px solid var(--line);font-size:12px}
.stp div b{display:block}
.stp div.on{background:var(--pri);border-color:var(--ac);color:#fff}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.net{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;text-align:center}
.node{border:2px solid var(--line);border-radius:14px;padding:8px;font-weight:600;font-size:13px;background:var(--inp);color:var(--ink);transition:border-color .15s,background .15s}
.node.sel{border-color:var(--ac);background:rgba(59,178,246,.12)}
.node small{display:block;font-weight:400;font-size:10px;color:var(--mut);margin-top:2px}
.ev{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;direction:ltr;text-align:left;background:var(--inp)}
.ev>div{display:grid;grid-template-columns:28px 1fr 1fr 60px;gap:4px;padding:6px 10px;font-size:12.5px;border-bottom:1px solid var(--line)}
pre{direction:ltr;text-align:left;background:var(--inp);border:1px solid var(--line);border-radius:12px;font-size:12.5px;padding:12px;overflow:auto;margin:8px 0}
</style>
</head>
<body>
<div id="app">
<header><h1>NetLab Pro <span class="df" data-i="sub"></span></h1><p data-i="sub"></p><div class="lg"><button data-l="ar">العربية</button><button data-l="fr">Français</button></div></header>
<nav><div id="tabs"></div></nav>
<section id="s0" class="on">
<div class="card df"><h2><span class="bd" data-i="def"></span>VLSM</h2><p class="ds" data-i="vd"></p></div>
<div class="card"><h2><span class="bd b2" data-i="app"></span><span data-i="vt"></span></h2>
<label for="base" data-i="vb"></label><input id="base" value="192.168.10.0/24" dir="ltr"><div style="height:12px"></div>
<div class="row"><button class="g" id="add" data-i="add"></button><button id="calc" data-i="calc"></button></div>
<div class="card"><h2><span class="bd" data-i="res"></span><span data-i="vt"></span></h2><div id="out"></div></div>
<div class="card"><h2><span class="bd b2" data-i="app"></span>CIDR</h2>
<div class="row"><div><label for="ci">IP/CIDR</label><input id="ci" value="172.16.5.77/20" dir="ltr"></div><button class="pri" id="cbf">=</button></div><div id="co"></div></div>
</section>
<section id="s1">
<div class="card df"><h2><span class="bd" data-i="def"></span>DHCP</h2><p class="ds" data-i="dd"></p></div>
<div class="card"><h2><span class="bd b2" data-i="app"></span><span data-i="dpara"></span><span data-i="stp"></span></h2>
<div class="cl lane"><div class="n"><span data-i="cli"></span><br><small>0.0.0.0</small></div><hr><div class="n s"><span id="ipd">192.168.10.24</span><br><small id="sid">00:11:22:33:44:55</small></div><div class="n r"><span data-i="srv"></span><br><small>0.0.0.0</small></div></div>
<div class="card"><h2><span class="bd b2" data-i="app"></span><span data-i="pool"></span></h2>
<div class="row"><div><label for="pf">Pool name</label><input id="pf" value="LAN"></div><div><label for="pn">Network</label><input id="pn" value="192.168.10.0" dir="ltr"></div><div class="sm"><label for="pm">Mask</label><input id="pm" value="255.255.255.0" dir="ltr"></div></div>
<button id="lease" class="pri" style="width:100%">Generate Pool</button><pre id="pst" style="font-size:13px;color:var(--mut);margin:10px 0 0"></pre>
<button id="ask" style="width:100%;margin-top:8px" data-i="ask"></button>
<div class="card"><h2><span class="bd b2" data-i="app"></span><span data-i="lease"></span></h2>
<label for="lrs">Lease duration (seconds)</label><input id="lrs" value="86400" dir="ltr">
<label for="lease" data-i="lease"></label><input type="range" id="lr" min="0" max="100" value="0" style="padding:0;margin-top:12px;border:0"><pre id="lt" style="margin-top:8px"></pre></div></div>
</section>
<section id="s2">
<div class="card df"><h2><span class="bd" data-i="def"></span>Unicast / Broadcast / ARP</h2><p class="ds" data-i="nd"></p></div>
<div class="card"><h2><span class="bd b2" data-i="app"></span>Broadcast</h2><label for="srcsel" data-i="srcsel"></label>
<div class="row"><button class="g" id="uni">Unicast</button><button id="bro" class="pri">Broadcast</button></div><div id="bnote" style="font-size:13px;color:var(--mut);margin-top:6px"></div></div>
<div class="card"><h2><span class="bd b2" data-i="app"></span><span data-i="same"></span></h2>
<div class="row"><div><label for="a1">A</label><input id="a1" value="192.168.10.26" dir="ltr"></div><div><label for="a2">B</label><input id="a2" value="192.168.10.67" dir="ltr"></div></div>
<button id="chk" style="width:100%" data-i="chk"></button><p id="cres" style="font-size:13.5px;margin:10px 0 0"></p></div>
</section>
<section id="s3">
<div class="card df"><h2><span class="bd" data-i="def"></span>VLAN</h2><p class="ds" data-i="vd"></p></div>
<div class="card"><h2><span class="bd b2" data-i="app"></span><span data-i="asg"></span></h2><div id="vld"></div>
<div class="row"><div><label for="vs" data-i="from"></label><select id="vs"></select></div><div><label for="vto" data-i="to"></label><select id="vto"></select></div></div>
<div class="row"><button class="g" id="vt" style="width:100%" data-i="vt"></button></div><pre id="vres" style="font-size:13.5px;margin:10px 0 0"></pre></div>
<div class="card"><h2><span class="bd" data-i="res"></span><span data-i="cfg"></span></h2><pre id="vcfg"></pre></div>
<div class="card"><h2><span class="bd b2" data-i="app"></span>ACL</h2>
<div class="row"><div><label for="ac" data-i="act"></label><select id="ac"><option>deny</option><option>permit</option></select></div>
<div><label for="as" data-i="src"></label><input id="as" value="192.168.10.0 0.0.0.63" dir="ltr"></div></div>
<button id="ag" style="width:100%" data-i="gen"></button><pre id="aout"></pre></div>
</section>
<section id="s4">
<div class="card df"><h2><span class="bd" data-i="def"></span><span data-i="jt"></span></h2><p class="ds" data-i="jd"></p></div>
<div class="card"><h2><span class="bd b2" data-i="app"></span><span data-i="jt"></span></h2>
<label for="pr">Protocol</label><select id="pr"><option value="ping">Ping (ARP + ICMP)</option><option value="arp">ARP</option></select>
<div class="note" id="jnote"></div><h2 style="font-size:16px;margin-top:12px" data-i="pdu"></h2><div id="frame"></div>
<div class="row" style="margin-top:10px"><button class="g" id="jp" data-i="pre"></button><button id="jx" data-i="cf"></button></div>
<div class="row"><button class="g" id="p1" data-i="play"></button><button class="g" id="rst" data-i="rst"></button></div>
<div class="stp" id="stp"></div><div class="bar" id="bar"><i id="pi"></i></div>
<h2 style="font-size:16px;margin-top:6px" data-i="evl"></h2><div class="evl" id="evl"></div></div>
<div class="card"><h2><span class="bd b2" data-i="app"></span><span data-i="labs"></span></h2><div class="bar"><i id="prg"></i></div><div class="labs" id="labs"></div></div>
<div class="note">Labs will appear here...</div>
</section>
</div>
<script>
var $=function(i){return document.getElementById(i)},lang='ar',S={ar:{},fr:{}};
try{lang=localStorage.getItem('nl')||'ar'}catch(e){}
function a(k,x,y){S.ar[k]=x;S.fr[k]=y;}
a('sub','محاكي بناء شبكة','Simulateur réseau'); a('def','تعريف','Définition'); a('app','تطبيق','Application'); a('res','النتيجة','Résultat');
a('t0','VLSM','VLSM'); a('t1','DHCP','DHCP'); a('t2','الشبكة','Réseau'); a('t3','VLAN','VLAN'); a('t4','المحاكي','Simulateur');
a('vd','تقسيم الشبكة','Segmentation'); a('vt','حساب VLSM','Calcul VLSM'); a('vb','شبكة الأساس','Réseau'); a('add','إضافة','Ajouter'); a('calc','احسب','Calculer');
a('dd','بروتوكول DHCP','Protocole DHCP'); a('cli','العميل','Client'); a('srv','الخادم','Serveur'); a('dpara','إعدادات','Paramètres'); a('pool','بركة','Pool');
a('lease','مدة الإيجار','Bail'); a('ask','اطلب','Demander'); a('stp','مراحل','Étapes');
a('nd','الفرق بين Unicast و Broadcast','Différence'); a('srcsel','المرسل','Expéditeur'); a('same','نفس الشبكة؟','Même réseau ?'); a('chk','تحقق','Vérifier');
a('vlan','تقسيم','Segmentation'); a('from','من','De'); a('to','إلى','À'); a('asg','تعيين','Assignation'); a('cfg','إعدادات','Config');
a('act','الإجراء','Action'); a('src','المصدر','Source'); a('gen','توليد','Générer'); a('aout','مخرجات ACL','Sortie ACL');
a('jt','محاكي تتبع الحزم','Simulateur'); a('jd','مسار الحزمة','Parcours du paquet'); a('pre','تحضير','Préparer'); a('cf','إطار','Cadre');
a('play','تشغيل','Lancer'); a('rst','إعادة','Reset'); a('pdu','وحدة البيانات','PDU'); a('frame','الإطار','Trame'); a('evl','الأحداث','Événements'); a('labs','المختبرات','Labs');
// إصلاح مصفوفة DHCP
var D=[['D','Discover'],['O','Offer'],['R','Request'],['A','Acknowledge']],di=0;
function dd(){var stp=$('stp');if(!stp)return;stp.innerHTML=D.map(function(s,i){return '<div class="'+(i===di?'on':'')+'"><b>'+s[0]+'</b>'+s[1]+'</div>'}).join('');}
// إصلاح بركة DHCP
function pool(){var pst=$('pst');if(!pst)return;pst.textContent='Pool Name: '+$('pf').value+'\nNetwork: '+$('pn').value+'\nMask: '+$('pm').value+'\nStatus: Created Successfully';}
// إصلاح شريط Lease
function ld(){var lr=$('lr'),lt=$('lt');if(!lr||!lt)return;var val=lr.value*864;lt.textContent=val+' seconds';}
// إصلاح الشبكة
var nm=['PC1','PC2','PC3','PC4'],nd=[];
function initNet(){var net=$('net');if(!net)return;net.innerHTML='';nd=[];nm.forEach(function(n,i){var d=document.createElement('div');d.className='node';d.innerHTML=n+'<small>10.0.0.'+(i+1)+'</small>';net.appendChild(d);nd.push(d);});}
function clr(){nd.forEach(function(n){n.classList.remove('sel');});}
function snd(m){clr();if(nd[0])nd[0].classList.add('sel');}
// إصلاح فحص الشبكة
function chk(){var a1=$('a1').value,a2=$('a2').value,o=$('cres');if(!o)return;if(a1===a2)o.innerHTML='<span class="err">Same IP</span>';else o.innerHTML='<span class="ok">Different IP</span>';}
// إصلاح VLAN والـ ACL
function vcf(){var vs=$('vs'),vto=$('vto');if(!vs||!vto)return;vs.innerHTML='<option>10</option><option>20</option><option>30</option>';vto.innerHTML='<option>10</option><option>20</option><option>30</option>';vt();}
function vt(){var vres=$('vres'),vcfg=$('vcfg');if(!vres||!vcfg)return;vres.textContent='VLAN '+$('vs').value+' assigned to '+$('vto').value;vcfg.textContent='interface vlan '+$('vs').value+'\n ip address 192.168.10.'+$('vs').value+' 255.255.255.0\n no shutdown';}
function ag(){var aout=$('aout');if(!aout)return;aout.textContent='access-list 101 '+$('ac').value+' '+$('as').value;}
// إصلاح CIDR
function cbf(){var co=$('co');if(!co)return;co.innerHTML='<div class="sn">IP: '+$('ci').value+' is valid.</div>';}
// إصلاح المحاكي
function build(){var o=$('frame');if(!o)return;o.innerHTML='<div style="border:2px solid var(--ac); padding:10px; margin:5px; text-align:center">Frame Header</div>';}
function sim(){var e=$('evl');if(!e)return;e.innerHTML='<div class="cl"><span>Event</span><span>Time</span></div>';var ev=document.createElement('div');ev.textContent='Packet sent successfully';e.appendChild(ev);}
// تفعيل التبويبات والترجمة
function initTabs(){var tabs=$('tabs');if(!tabs)return;tabs.innerHTML='';['t0','t1','t2','t3','t4'].forEach(function(k,i){var b=document.createElement('button');if(i===0)b.className='on';b.textContent=S[lang][k];b.onclick=function(){document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');document.querySelectorAll('section').forEach(function(x){x.classList.remove('on');});$('s'+i).classList.add('on');};tabs.appendChild(b);});document.querySelectorAll('[data-i]').forEach(function(el){if(S[lang][el.dataset.i])el.textContent=S[lang][el.dataset.i];});}
// التهيئة
window.onload=function(){
    initTabs();dd();ld();initNet();vcf();
    if($('ag'))$('ag').onclick=ag;if($('lease'))$('lease').onclick=pool;if($('cbf'))$('cbf').onclick=cbf;
    if($('chk'))$('chk').onclick=chk;if($('vt'))$('vt').onclick=vt;if($('jp'))$('jp').onclick=build;
    if($('jx'))$('jx').onclick=sim;if($('lr'))$('lr').oninput=ld;
    document.querySelectorAll('.lg button').forEach(function(b){
        if(b.dataset.l===lang)b.classList.add('on');
        b.onclick=function(){lang=b.dataset.l;try{localStorage.setItem('nl',lang)}catch(e){}initTabs();document.querySelectorAll('.lg button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');};
    });
};
</script>
</body>
</html>
