<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetLab Pro</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0F1E;--card:#111A2E;--ink:#EAF0FF;--mut:#93A3C4;--pri:#235AAE;--pri2:#18243F;--ac:#3B82F6;--hot:#F59E0B;--ok:#34D399;--line:#243352;--bad:#F87171;--inp:#0A1020;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg) linear-gradient(180deg,#14264A 0,var(--bg) 380px) no-repeat;color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:560px;margin:0 auto;padding:0 14px 40px}
header{text-align:center;padding:26px 8px 16px;border-bottom:1px solid var(--line);margin:0 -14px 16px}
h1{margin:0;font-size:30px;line-height:1.3}header p{margin:4px 0 12px;color:var(--mut)}
.lg{display:inline-flex;gap:6px}.lg button{padding:6px 16px;border-radius:20px;background:var(--pri2);border-color:var(--line);font-size:14px}.lg button.on{background:var(--pri);border-color:var(--ac)}
nav div{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:16px}
nav button{width:calc(33.33% - 7px);background:var(--pri2);border:1px solid var(--line);padding:14px 4px;font-weight:500}nav button.on{background:var(--pri);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}
.df{border-inline-start:5px solid var(--ok)}
h2{font-size:19px;margin:0 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bd{font-size:12.5px;font-weight:600;padding:2px 12px;border-radius:20px;background:#12382F;color:var(--ok);border:1px solid #1F6B52}.b2{background:#16294F;color:#7FB0FF;border-color:#2B4C8C}
.ds{color:var(--mut);margin:0 0 14px;font-size:14.5px}.df .ds{margin:0;color:var(--ink)}
label{display:block;font-size:13.5px;color:var(--mut);margin-bottom:5px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--inp);color:var(--ink);font:inherit;font-size:16px}
input[dir=ltr]{text-align:left}
.row{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}.row>*{min-width:0;flex:1}.row>.sm{flex:0 0 auto}
button{font:inherit;font-weight:600;border:1px solid var(--ac);border-radius:14px;padding:12px 16px;cursor:pointer;background:var(--pri);color:#fff}
button.g{background:var(--pri2);border-color:var(--line);color:var(--ink)}button.x{background:none;border-color:transparent;color:var(--bad);padding:8px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
section{display:none}section.on{display:block}
.stat{display:flex;gap:10px;margin-bottom:12px}.stat div{flex:1;background:var(--inp);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.stat b{display:block;font-size:21px}.stat span{font-size:12.5px;color:var(--mut)}
.seg{display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--line);margin:4px 0 14px;direction:ltr}.seg i{display:block;height:100%;border-inline-end:2px solid var(--card)}
.sn{background:var(--inp);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;border-inline-start:5px solid var(--ac)}.sn small{color:var(--mut)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:1px 10px;font-size:13.5px;direction:ltr;text-align:left;margin-top:6px}.kv span:nth-child(odd){color:var(--mut)}
.err{color:var(--bad);font-weight:600}.okc{color:var(--ok);font-weight:600}
.lane{position:relative;height:80px;direction:ltr;margin:6px 0 12px}
.lane .n{position:absolute;top:8px;width:84px;text-align:center;border:1px solid var(--line);border-radius:14px;padding:8px 0;background:var(--inp);font-weight:600;font-size:13px}
.lane .c{left:0}.lane .s{right:0}.lane hr{position:absolute;top:38px;left:90px;right:90px;border:0;border-top:2px dashed var(--line);margin:0}
.pkt{position:absolute;top:24px;left:92px;padding:3px 10px;border-radius:12px;background:var(--hot);color:#111;font-size:12px;font-weight:700;transition:left .6s}
.stp{display:flex;gap:8px;margin-bottom:12px}.stp div{flex:1;text-align:center;padding:8px 0;border-radius:12px;background:var(--inp);border:1px solid var(--line);font-weight:700;color:var(--mut)}
.stp div.on{background:var(--pri);border-color:var(--ac);color:#fff}.stp div.dn{background:#12382F;border-color:#1F6B52;color:var(--ok)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.net{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;text-align:center}
.node{border:2px solid var(--line);border-radius:14px;padding:8px 2px;font-weight:600;font-size:13px;background:var(--inp);transition:.3s}.node small{display:block;font-weight:400;color:var(--mut);font-size:10.5px;direction:ltr}
.node.src{border-color:var(--hot)}.node.rx{border-color:var(--ok);background:#12382F}.node.blk{border-color:var(--bad);opacity:.75}.rt{grid-column:1/-1}
.cl{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:13.5px;direction:ltr}
.jn{position:relative;display:grid;grid-template-columns:repeat(5,1fr);direction:ltr;text-align:center;margin:34px 0 8px;gap:4px}
.nd{border:2px solid var(--line);border-radius:12px;background:var(--inp);padding:6px 0;font-size:20px;line-height:1.2;opacity:.9}.nd small{display:block;font-size:10.5px;color:var(--mut)}
.nd.on{border-color:var(--hot);background:#3A2A10}.nd.off{opacity:.3}
.pk{position:absolute;top:-30px;font-size:24px;transform:translateX(-50%);transition:left .7s}
.f{border:2px solid;border-radius:12px;padding:6px 10px;margin-top:6px;font-size:12.5px;direction:ltr;text-align:left}.f b{margin-inline-end:6px}.f code{color:var(--ink)}
.f2{border-color:#8B5CF6}.f3{border-color:#3B82F6}.f4{border-color:var(--hot)}.f5{border-color:var(--ok)}
.note{background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
details.lab{border-top:1px solid var(--line);padding:4px 0}details.lab:first-of-type{border-top:0}summary{font-weight:600;cursor:pointer;padding:8px 0}
.step{display:flex;gap:10px;padding:5px 0;font-size:14px}.step input{width:20px;height:20px;flex:none;margin-top:3px;padding:0}
pre{direction:ltr;text-align:left;background:var(--inp);border:1px solid var(--line);border-radius:12px;font-size:12.5px;padding:8px 12px;overflow-x:auto;margin:4px 0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.svgw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--inp);margin-top:10px}svg text{fill:var(--ink)}
.evl{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.ev{display:grid;grid-template-columns:28px 1fr 1fr 60px;gap:4px;padding:6px 10px;font-size:12.5px;border-bottom:1px solid var(--line);cursor:pointer;direction:ltr}.ev.on{background:var(--pri)}.ev.hd{color:var(--mut);cursor:default;position:sticky;top:0;background:var(--card)}
</style>
</head>
<body>
<div id="app">
<header><h1>NetLab Pro 📡</h1><p data-i="sub"></p><div class="lg"><button data-l="ar">عربية</button><button data-l="fr">Français</button></div></header>

<div class="row"><div><label for="as" data-i="src"></label><input id="as" value="192.168.10.0 0.0.0.63" dir="ltr"></div><div><label for="ad" data-i="dst"></label><input id="ad" value="192.168.10.128 0.0.0.7" dir="ltr"></div></div>
<button id="ag" style="width:100%" data-i="gen"></button><pre id="aout"></pre></div></section>

<div class="row"><div><label for="ac" data-i="act"></label><select id="ac"><option>deny</option><option>permit</option></select></div><div><label for="ap" data-i="prt"></label><select id="ap"><option>tcp</option><option>udp</option><option>icmp</option><option>ip</option></select></div></div>

<script>
var $=function(i){return document.getElementById(i)},lang='ar',S={ar:{},fr:{}};
try{lang=localStorage.getItem('nl')||'ar'}catch(e){}
function a(k,x,y){S.ar[k]=x;S.fr[k]=y}function t(k){return S[lang][k]}
a('sub','محاكي مرئي لإدارة الشبكات','Simulateur visuel d’administration réseau');
a('def','تعريف','Définition');a('app','تطبيق','Application');a('res','النتيجة','Résultat');
a('t0','VLSM','VLSM');a('t1','DHCP','DHCP');a('t2','الشبكة','Réseau');a('t3','VLAN','VLAN');a('t4','المخبر','Labo');
a('vd','VLSM تقنية تعطي كل شبكة فرعية قناعا بطول مختلف حسب حاجتها فلا يضيع العنوان. الخطوات: رتّب الشبكات من الأكبر إلى الأصغر، احسب البتات بالقاعدة 2ⁿ − 2 ≥ عدد الأجهزة، ثم ابدأ كل شبكة من مضاعف حجمها.','Le VLSM donne à chaque sous-réseau un masque de longueur différente selon son besoin, sans gaspiller d’adresses. Étapes : trier du plus grand au plus petit, calculer les bits avec 2ⁿ − 2 ≥ hôtes, puis démarrer chaque réseau à un multiple de sa taille.');
a('vt','حاسبة VLSM','Calculateur VLSM');a('vb','الشبكة الأم','Réseau parent');a('add','إضافة شبكة','Ajouter un réseau');a('calc','احسب','Calculer');
a('used','مستعمل','Utilisé');a('free','عنوان حر','Adresses libres');a('noroom','لا توجد مساحة كافية','Espace insuffisant');a('hst','جهاز','hôtes');a('cap','تتسع لـ','capacité');
a('copy','نسخ الجدول','Copier le tableau');a('copied','تم النسخ','Copié');a('badin','اكتب الشبكة الأم مثل 192.168.10.0/24','Saisissez le réseau parent, ex. 192.168.10.0/24');
a('an','تحليل','Analyser');a('prv','خاص','Privé');a('pub','عام','Public');a('cls','الفئة','Classe');a('hosts','الأجهزة','Hôtes');a('typ','النوع','Type');a('bad','صيغة غير صحيحة','Format invalide');
aa('jd','تتبّع رسالة عبر الأجهزة والطبقات: السويتش يقرأ MAC فقط ويمرر الإطار كما هو، أما الراوتر فينزع الإطار ويقرأ IP ثم يبني إطارا جديدا بعناوين MAC جديدة. عنوان IP يبقى ثابتا طوال الرحلة.','Suivez un message à travers les équipements et les couches : le switch lit seulement la MAC et transmet la trame telle quelle ; le routeur retire la trame, lit l’IP puis construit une nouvelle trame avec de nouvelles MAC. L’IP reste identique tout le trajet.');
a('play','تشغيل','Lecture');
a('nsrc','المصدر: يبني الرسالة ويغلّفها من الأعلى إلى الأسفل.','Source : construit le message et l’encapsule de haut en bas.');
a('nsw','السويتش: يقرأ MAC الوجهة فقط ويمرر الإطار دون تغيير.','Switch : lit uniquement la MAC de destination et transmet sans modifier.');
a('nrt','الراوتر: ينزع الإطار، يقرأ IP، ثم يبني إطارا جديدا بعناوين MAC جديدة.','Routeur : retire la trame, lit l’IP puis reconstruit une trame avec de nouvelles MAC.');
a('nend','الوجهة: تفك التغليف من الأسفل إلى الأعلى وتسلّم البيانات للتطبيق.','Destination : décapsule de bas en haut et remet les données à l’application.');
a('labs','مخابر Packet Tracer','Labos Packet Tracer');a('dn','أنجزت','Terminé');a('of','من','sur');a('stp','خطوة','étapes');
function ap(){document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=t(e.dataset.i)});document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';
