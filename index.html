<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetLab Pro</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0F1E;--card:#111A2E;--ink:#EAF0FF;--mut:#93A3C4;--pri:#235AAE;--pri2:#18243F;--ac:#3BB2F6;--hot:#F59E0B;--box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,#14264A 0,var(--bg) 380px) no-repeat;color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14px}
#app{max-width:560px;margin:0 auto;padding:0 14px 40px}
header{text-align:center;padding:26px 0 16px;border-bottom:1px solid var(--line);margin:0 -14px 16px}
h1{margin:0;font-size:30px;line-height:1.3}
header p{margin:4px 0 12px;color:var(--mut)}
.lg{display:inline-flex;gap:6px}
.lg button{padding:6px 16px;border-radius:20px;background:var(--pri2);border:1px solid var(--line);color:var(--mut);font-size:12px;cursor:pointer}
.lg button.on{background:var(--ac);color:#04121F;border-color:transparent}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:16px}
nav button{width:calc(33.33% - 7px);background:var(--pri2);border:1px solid var(--line);padding:14px 4px;font-weight:600;font-size:13px;color:var(--mut);border-radius:14px;cursor:pointer}
nav button.on{background:var(--ac);color:#04121F;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px}
.df{display:inline-start;padding:4px 8px;font-size:12px;border-radius:8px;background:var(--pri2);color:var(--ac);margin-bottom:10px}
h2{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bd{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:#12382F;color:var(--ok)}
.bd.hot{background:#3A2A10;color:var(--hot)}
.bd.info{background:#12243F;color:var(--ac)}
.ds{color:var(--mut);margin:0 0 14px;font-size:14.5px}
.df .ds{margin:0;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--inp);color:var(--ink);font-size:14px;font-family:inherit;box-sizing:border-box}
input[dir=ltr]{text-align:left}
.row{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
.row>*{min-width:0;flex:1}
.row .sm{flex:0 0 auto}
button{font:inherit;font-weight:600;border:1px solid var(--ac);border-radius:14px;padding:12px 16px;cursor:pointer;background:var(--inp);color:var(--ink)}
button.pri{background:var(--pri2);border-color:var(--line);color:var(--ac)}
button.x{background:var(--pri2);border:0;color:var(--mut);padding:8px 10px;font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
section{display:none}
section.on{display:block}
.stat{display:flex;gap:10px;margin-bottom:12px}
.stat div{flex:1;background:var(--inp);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px}
.stat b{display:block;color:var(--ac);font-size:15px;margin-top:4px}
.seg{display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--line);margin:4px 0 14px;direction:ltr}
.sn{background:var(--inp);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;font-family:monospace;direction:ltr;font-size:13.5px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:10px;font-size:13.5px;direction:ltr;text-align:left;margin-top:8px}
.err{color:var(--bad);font-weight:600}
.ok{color:var(--ok);font-weight:600}
.lane{position:relative;height:60px;direction:ltr;margin:0 8px 12px}
.lane::before{content:'';position:absolute;top:8px;width:100%;height:4px;background:var(--line);border-radius:4px}
.lane .c{left:0}.lane .r{right:0}
.lane hr{position:absolute;top:38px;left:0;width:100%;height:4px;background:var(--line);border:0}
.cl{position:absolute;top:24px;left:2px;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#04121F;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:11px}
.stp{display:flex;gap:8px;margin-bottom:12px}
.stp div{flex:1;text-align:center;padding:8px;border-radius:14px;background:var(--inp);border:1px solid var(--line);font-size:12px}
.stp div b{display:block}
.stp div.on{background:var(--pri);border-color:var(--ac);color:#fff}
.stp div.on b{color:#fff}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.net{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;text-align:center}
.node{border:2px solid var(--line);border-radius:14px;padding:8px;font-weight:600;font-size:13px;background:var(--inp);color:var(--ink);transition:border-color .15s,background .15s}
.node.sel{border-color:var(--ac);background:rgba(59,178,246,.12)}
.node.r{border-color:var(--hot)}
.node.r.sel{border-color:var(--hot);background:rgba(245,158,11,.12)}
.node small{display:block;font-weight:400;font-size:10px;color:var(--mut);margin-top:2px}
.cl{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;font-size:12.5px}
.jn{position:relative;display:grid;grid-template-columns:repeat(5,1fr);direction:ltr;text-align:center;margin:0 0 8px}
.jn::before{content:'';position:absolute;top:4px;left:10%;right:10%;height:2px;background:var(--line);z-index:0}
.jn div{position:relative;z-index:1;background:var(--inp);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;margin:0 auto;color:var(--ink)}
.jn div.on{border-color:var(--ac);background:var(--ac);color:#04121F}
.jn div.err{border-color:var(--bad);background:#3A1414;color:var(--bad)}
.pk{position:absolute;top:30px;font-size:24px;transform:translateX(-50%);transition:left .7s}
#f{border:2px solid var(--line);border-radius:12px;padding:6px 10px;margin-top:6px;font-size:12.5px;direction:ltr;text-align:left}
.f2{border-color:#B85CF6}
.f3{border-color:#3BB2F6}
.f4{border-color:var(--hot)}
.f5{border-color:var(--ok)}
.note{background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
details{border-top:1px solid var(--line);padding:4px 0}
details:last-child{border-bottom:0}
summary{font-weight:600;font-size:13.5px;padding:10px 0;cursor:pointer}
.step{display:flex;gap:10px;padding:5px 0;font-size:14px}
.step input{width:20px;height:20px;flex:none;margin-top:3px}
pre{direction:ltr;text-align:left;background:var(--inp);border:1px solid var(--line);border-radius:12px;font-size:12.5px;padding:12px;overflow:auto;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
svg{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--inp);margin-top:10px}
svg text{fill:#EAF0FF;font-family:monospace}
.ev{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;direction:ltr;text-align:left;background:var(--inp)}
.ev>div{display:grid;grid-template-columns:28px 1fr 1fr 60px;gap:4px;padding:6px 10px;font-size:12.5px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div id="app">
<header><h1>NetLab Pro <span class="df" data-i="sub"></span></h1><p data-i="sub"></p><div class="lg"><button data-l="ar">العربية</button><button data-l="fr">Français</button></div></header>
<nav><div id="tabs"></div></nav>

<section id="s0" class="on">

<section id="s1">

<section id="s3">
<div class="card df"><h2><span class="bd" data-i="def"></span>VLAN</h2><p class="ds" data-i="vd"></p></div>

<div class="row"><button class="g" id="vt" style="width:100%" data-i="vt"></button></div><pre id="vres" style="font-size:13.5px;margin:10px 0 0"></pre></div>
<div class="card"><h2><span class="bd" data-i="res"></span><span data-i="cfg"></span></h2><pre id="vcfg"></pre></div>
<div class="card"><h2><span class="bd b2" data-i="app"></span>ACL</h2>
<div class="row"><div><label for="ac" data-i="act"></label><select id="ac"><option>deny</option><option>permit</option></select></div>
<div><label for="as" data-i="src"></label><input id="as" value="192.168.10.0 0.0.0.63" dir="ltr"></div></div>
<button id="ag" style="width:100%" data-i="gen"></button><pre id="aout"></pre></div>
</section>

<section id="s4">
<div class="card df"><h2><span class="bd" data-i="def"></span><span data-i="jt"></span></h2><p class="ds" data-i="jd"></p></div>
<div class="card"><h2><span class="bd b2" data-i="app"></span><span data-i="jt"></span></h2>

var pcs=['PC1','PC2','PC3','PC4','PC5','PC6'],vv=[10,10,20,20,30,30];
function vcf(){var s=$('vs').value;for(var i=0;i<20;i++){var v='vlan'+i;if(!(v in S))S[v]=v;}for(var i=0;i<20;i++){var p='P'+i;if(!(p in S))S[p]=p;}var v='vlan'+s;if(!(v in S))S[v]='VLAN '+s;var s1=$('vd');if(!s1)return;s1.value=S[v];s1.onchange=function(){vv[+s]=+this.value;vcfg();};$('v1').innerHTML='<b>VLAN</b> '+s;vcfg();}

function ag(){var o=$('aout');if(!o)return;var ac=$('ac').value,ap=$('as').value,as=$('as').value;o.textContent = 'access-list 101 ' + ac + ' ' + ap + ' ' + as;}

var jm={'ping':'ARP + ICMP','arp':'ARP'},N={},P={},C={},A={},d={};
var NO={'192.168.10.0/26':'R1'},L={'R1','R2'},S1={'R1','R2','R3'};
P={};

M={'00:11:22:33:44:55':'00:11:22:33:44:55'};
arp={t:'00:11:22:33:44:55',m:'aa:bb:cc:dd:ee:ff'};
P={p:[1,2]};
function build(){var o=$('frame');if(!o)return;var f1=document.createElement('div');f1.className='f3';f1.textContent='Frame';var f2=document.createElement('div');f2.className='f2';f2.textContent='IPv4';var f3=document.createElement('div');f3.className='f3';f3.textContent='TCP';var f4=document.createElement('div');f4.className='f4';f4.textContent='Payload';o.innerHTML='';o.appendChild(f1);o.appendChild(f2);o.appendChild(f3);o.appendChild(f4);}
function sim(){var e=$('ev');if(!e)return;e.innerHTML='<div class="cl"><span>Event</span><span>Time</span></div>';var ev=document.createElement('div');ev.textContent='Packet sent';e.appendChild(ev);}function init(){
    var tabs=$('tabs');
    if(tabs){
        tabs.innerHTML='';
        ['s0','s1','s2','s3','s4'].forEach(function(id,i){
            var b=document.createElement('button');
            b.textContent=S[lang]['t'+i];
            b.onclick=function(){
                document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('on');});
                b.classList.add('on');
                document.querySelectorAll('section').forEach(function(s){s.classList.remove('on');});
                $(id).classList.add('on');
            };
            if(i===0) b.classList.add('on');
            tabs.appendChild(b);
        });
    }

    var lg=document.querySelector('.lg');
    if(lg){
        lg.querySelectorAll('button').forEach(function(b){
            b.onclick=function(){
                lang=b.dataset.l;
                try{localStorage.setItem('nl',lang)}catch(e){}
                init();
            };
            if(b.dataset.l===lang) b.classList.add('on'); else b.classList.remove('on');
        });
    }

    document.querySelectorAll('[data-i]').forEach(function(el){
        var k=el.dataset.i;
        if(S[lang] && S[lang][k]) el.textContent=S[lang][k];
    });

    var base=$('base');
    if(base) base.oninput=function(){ /* VLSM logic placeholder */ };

    var calc=$('calc');
    if(calc) calc.onclick=function(){
        var v=$('base').value;
        if(!v.includes('/')) { $('out').innerHTML='<span class="err">'+S[lang].badin+'</span>'; return; }
        $('out').innerHTML='<div class="sn">VLSM calculation simulated for '+v+'</div>';
    };

    var cbf=$('cbf');
    if(cbf) cbf.onclick=function(){
        var v=$('ci').value;
        $('co').innerHTML='<div class="sn">CIDR calculation for '+v+'</div>';
    };

    var ask=$('ask');
    if(ask) ask.onclick=function(){
        var pst=$('pst');
        if(pst) pst.textContent='DHCP Discover -> Offer -> Request -> Acknowledge';
    };

    var leaseBtn=document.querySelector('button#lease');
    if(leaseBtn) leaseBtn.onclick=function(){
        if(typeof pool === 'function') pool();
    };

    var lr=$('lr');
    if(lr) lr.oninput=function(){
        if(typeof ld === 'function') ld();
    };

    var uni=$('uni');
    if(uni) uni.onclick=function(){ if(typeof snd==='function'){snd(1); f1(1);} };
    
    var bro=$('bro');
    if(bro) bro.onclick=function(){ if(typeof snd==='function'){snd(0); f1(0);} };

    var chkBtn=$('chk');
    if(chkBtn) chkBtn.onclick=function(){
        if(typeof chk === 'function') chk();
    };

    var vtBtn=$('vt');
    if(vtBtn) vtBtn.onclick=function(){ if(typeof vt==='function') vt(); };

    var agBtn=$('ag');
    if(agBtn) agBtn.onclick=function(){ if(typeof ag==='function') ag(); };

    var jp=$('jp');
    if(jp) jp.onclick=function(){ if(typeof build==='function') build(); };
    
    var jx=$('jx');
    if(jx) jx.onclick=function(){ if(typeof sim==='function') sim(); };
}

window.onload = init;
</script>
</body>
</html>
